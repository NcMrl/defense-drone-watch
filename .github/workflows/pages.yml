# Publie la page de démonstration (demo/index.html, données synthétiques) sur GitHub Pages.
# Prérequis unique : Settings → Pages → Source : « GitHub Actions ».
name: Page de démonstration

on:
  push:
    branches: [main]
    paths: ["demo/index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site (page de démonstration uniquement)
        run: |
          mkdir -p _site
          # La page publiée est un fragment : on l'enveloppe dans un document HTML complet
          {
            echo '<!doctype html><html lang="fr"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
            echo '<style>html{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>'
            echo '</head><body>'
            cat demo/index.html
            echo '</body></html>'
          } > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

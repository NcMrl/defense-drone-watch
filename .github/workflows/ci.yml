name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ddw, POSTGRES_PASSWORD: ddw, POSTGRES_DB: ddw_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ddw" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env: { DDW_TEST_DATABASE_URL: "postgresql+psycopg://ddw:ddw@localhost:5432/ddw_test" }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

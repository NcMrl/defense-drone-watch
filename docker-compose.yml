# Defense Drone Watch — installation de développement / démonstration.
# Usage : cp .env.example .env  (puis renseigner DDW_ADMIN_TOKEN)  &&  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ddw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ddw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddw"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DDW_DATABASE_URL: postgresql+psycopg://ddw:${POSTGRES_PASSWORD}@db:5432/ddw
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DDW_DATABASE_URL: postgresql+psycopg://ddw:${POSTGRES_PASSWORD}@db:5432/ddw
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
